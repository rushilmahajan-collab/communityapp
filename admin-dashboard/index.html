<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community App Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --earth: #d9ac89;
      --earth-dark: #ba8d66;
      --gray-900: #1c1c1c;
      --gray-700: #464646;
      --gray-600: #666666;
      --gray-100: #f0f0f0;
      --red: #ff6b6b;
      --green: #51cf66;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-100);
    }

    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-box h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: var(--gray-900);
    }

    .login-box p {
      color: var(--gray-600);
      margin-bottom: 32px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--gray-900);
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--earth);
      box-shadow: 0 0 0 3px rgba(217, 172, 137, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: var(--earth);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
    }

    .login-btn:hover {
      background: var(--earth-dark);
    }

    .dashboard-container {
      display: none;
      min-height: 100vh;
      background: var(--gray-100);
    }

    .sidebar {
      width: 280px;
      background: var(--gray-900);
      color: white;
      padding: 32px 24px;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 20px;
      margin-bottom: 32px;
      color: var(--earth);
    }

    .nav-item {
      padding: 12px 16px;
      cursor: pointer;
      border-radius: 8px;
      margin-bottom: 8px;
      transition: all 0.2s;
      font-size: 14px;
      border: none;
      background: none;
      color: white;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      background: rgba(217, 172, 137, 0.1);
    }

    .nav-item.active {
      background: var(--earth);
      color: white;
    }

    .logout-btn {
      position: absolute;
      bottom: 24px;
      left: 24px;
      right: 24px;
      padding: 12px;
      background: var(--red);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .main-content {
      margin-left: 280px;
      padding: 32px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .page-title {
      font-size: 28px;
      font-weight: bold;
      color: var(--gray-900);
      margin-bottom: 32px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      border-left: 4px solid var(--earth);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--gray-600);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: var(--gray-900);
    }

    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid #e0e0e0;
    }

    .user-item:last-child {
      border-bottom: none;
    }

    .user-info h4 {
      font-size: 16px;
      margin-bottom: 4px;
      color: var(--gray-900);
    }

    .user-info p {
      font-size: 13px;
      color: var(--gray-600);
    }

    .log-item {
      padding: 16px;
      border-bottom: 1px solid #e0e0e0;
      font-size: 14px;
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .log-timestamp {
      color: var(--gray-600);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .log-action {
      color: var(--gray-900);
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--green);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-danger {
      background: var(--red);
      color: white;
    }

    .btn-danger:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--gray-100);
      color: var(--gray-900);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--gray-600);
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--gray-100);
      border-top: 3px solid var(--earth);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .main-content {
        margin-left: 0;
        padding: 16px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Login Page -->
  <div class="login-container" id="loginPage">
    <div class="login-box">
      <h1>Admin Dashboard</h1>
      <p>Sign in to manage your community</p>
      <form onsubmit="login(event)">
        <div class="form-group">
          <label>API URL</label>
          <input type="url" id="apiUrl" placeholder="https://your-railway-url.app/api" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="admin@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="login-btn">Sign In</button>
        <p id="loginError" style="color: var(--red); margin-top: 16px; font-size: 14px; display: none;"></p>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard-container" id="dashboardPage">
    <div class="sidebar">
      <h2>Community App</h2>
      <button class="nav-item active" onclick="showPage('stats')">📊 Statistics</button>
      <button class="nav-item" onclick="showPage('users')">👥 Users</button>
      <button class="nav-item" onclick="showPage('logs')">📋 Activity Log</button>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>

    <div class="main-content">
      <!-- Statistics Page -->
      <div class="page active" id="stats">
        <h1 class="page-title">Dashboard Statistics</h1>
        <div id="statsList">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Users Page -->
      <div class="page" id="users">
        <h1 class="page-title">User Management</h1>
        <p style="color: var(--gray-600); margin-bottom: 24px;">View and manage users</p>
        <div class="card">
          <input type="text" id="userSearch" placeholder="Search by name or email..." style="width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px;">
        </div>
        <div id="usersList">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Logs Page -->
      <div class="page" id="logs">
        <h1 class="page-title">Activity Log</h1>
        <p style="color: var(--gray-600); margin-bottom: 24px;">Audit trail of admin actions</p>
        <div id="logsList">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let apiUrl = '';
    let token = '';
    let allUsers = [];

    async function login(event) {
      event.preventDefault();

      apiUrl = document.getElementById('apiUrl').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');

      try {
        const response = await fetch(`${apiUrl}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          errorEl.textContent = data.error || 'Login failed';
          errorEl.style.display = 'block';
          return;
        }

        token = data.token;
        localStorage.setItem('adminToken', token);
        localStorage.setItem('adminApiUrl', apiUrl);

        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('dashboardPage').style.display = 'flex';

        loadStats();
      } catch (err) {
        errorEl.textContent = 'Network error: ' + err.message;
        errorEl.style.display = 'block';
      }
    }

    function logout() {
      token = '';
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminApiUrl');
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('dashboardPage').style.display = 'none';
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');

      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (pageId === 'stats') loadStats();
      if (pageId === 'users') loadUsers();
      if (pageId === 'logs') loadLogs();
    }

    async function loadStats() {
      const container = document.getElementById('statsList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        const response = await fetch(`${apiUrl}/admin/stats`, {
          headers: { 'Authorization': `Bearer ${token}` },
        });

        if (!response.ok) throw new Error('Failed to load stats');

        const data = await response.json();

        container.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">Total Users</div>
              <div class="stat-value">${data.total_users || 0}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Groups Created</div>
              <div class="stat-value">${data.total_groups || 0}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Messages Sent</div>
              <div class="stat-value">${data.total_messages || 0}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Hangouts Completed</div>
              <div class="stat-value">${data.total_hangouts || 0}</div>
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="card"><p style="text-align: center; color: var(--red);">Failed to load statistics</p></div>`;
      }
    }

    async function loadUsers() {
      const container = document.getElementById('usersList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        const response = await fetch(`${apiUrl}/users`, {
          headers: { 'Authorization': `Bearer ${token}` },
        });

        if (!response.ok) throw new Error('Failed to load users');

        const data = await response.json();
        allUsers = data.users || [];

        renderUsers(allUsers);

        // Setup search
        document.getElementById('userSearch').addEventListener('input', (e) => {
          const query = e.target.value.toLowerCase();
          const filtered = allUsers.filter(u =>
            u.first_name.toLowerCase().includes(query) ||
            u.email.toLowerCase().includes(query)
          );
          renderUsers(filtered);
        });
      } catch (err) {
        container.innerHTML = `<div class="card"><p style="text-align: center; color: var(--red);">Failed to load users</p></div>`;
      }
    }

    function renderUsers(users) {
      const container = document.getElementById('usersList');

      if (users.length === 0) {
        container.innerHTML = '<div class="card"><p style="text-align: center; color: var(--gray-600);">No users found</p></div>';
        return;
      }

      container.innerHTML = `
        <div class="card">
          ${users.map(user => `
            <div class="user-item">
              <div class="user-info">
                <h4>${user.first_name}</h4>
                <p>${user.email}</p>
                <p>${user.city}</p>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function loadLogs() {
      const container = document.getElementById('logsList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        const response = await fetch(`${apiUrl}/admin/logs`, {
          headers: { 'Authorization': `Bearer ${token}` },
        });

        if (!response.ok) throw new Error('Failed to load logs');

        const data = await response.json();
        const logs = data.logs || [];

        if (logs.length === 0) {
          container.innerHTML = '<div class="card"><p style="text-align: center; color: var(--gray-600);">No activity logs yet</p></div>';
          return;
        }

        container.innerHTML = `
          <div class="card">
            ${logs.map(log => `
              <div class="log-item">
                <div class="log-timestamp">${new Date(log.created_at).toLocaleString()}</div>
                <div class="log-action">${log.action}</div>
              </div>
            `).join('')}
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="card"><p style="text-align: center; color: var(--red);">Failed to load activity logs</p></div>`;
      }
    }

    // Restore session on page load
    window.addEventListener('load', () => {
      const savedToken = localStorage.getItem('adminToken');
      const savedApiUrl = localStorage.getItem('adminApiUrl');

      if (savedToken && savedApiUrl) {
        token = savedToken;
        apiUrl = savedApiUrl;
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('dashboardPage').style.display = 'flex';
        loadStats();
      }
    });
  </script>
</body>
</html>
