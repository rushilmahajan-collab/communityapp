<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community App Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --earth: #d9ac89;
      --earth-dark: #ba8d66;
      --gray-900: #1c1c1c;
      --gray-700: #464646;
      --gray-600: #666666;
      --gray-100: #f0f0f0;
      --red: #ff6b6b;
      --green: #51cf66;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-100);
    }

    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-box h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: var(--gray-900);
    }

    .login-box p {
      color: var(--gray-600);
      margin-bottom: 32px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--gray-900);
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--earth);
      box-shadow: 0 0 0 3px rgba(217, 172, 137, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: var(--earth);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
    }

    .login-btn:hover {
      background: var(--earth-dark);
    }

    .dashboard-container {
      display: none;
      min-height: 100vh;
      background: var(--gray-100);
    }

    .sidebar {
      width: 280px;
      background: var(--gray-900);
      color: white;
      padding: 32px 24px;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 20px;
      margin-bottom: 32px;
      color: var(--earth);
    }

    .nav-item {
      padding: 12px 16px;
      cursor: pointer;
      border-radius: 8px;
      margin-bottom: 8px;
      transition: all 0.2s;
      font-size: 14px;
      border: none;
      background: none;
      color: white;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      background: rgba(217, 172, 137, 0.1);
    }

    .nav-item.active {
      background: var(--earth);
      color: white;
    }

    .logout-btn {
      position: absolute;
      bottom: 24px;
      left: 24px;
      right: 24px;
      padding: 12px;
      background: var(--red);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .main-content {
      margin-left: 280px;
      padding: 32px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .page-title {
      font-size: 28px;
      font-weight: bold;
      color: var(--gray-900);
      margin-bottom: 32px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      border-left: 4px solid var(--earth);
    }

    .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--gray-600);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: var(--gray-900);
    }

    .verification-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      display: flex;
      gap: 20px;
    }

    .video-player {
      width: 300px;
      height: 200px;
      background: #000;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .video-player video {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
    }

    .verification-info {
      flex: 1;
    }

    .verification-info h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--gray-900);
    }

    .verification-info p {
      color: var(--gray-600);
      font-size: 14px;
      margin-bottom: 4px;
    }

    .verification-actions {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--green);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-danger {
      background: var(--red);
      color: white;
    }

    .btn-danger:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--gray-100);
      color: var(--gray-900);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--gray-600);
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--gray-100);
      border-top: 3px solid var(--earth);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .main-content {
        margin-left: 0;
        padding: 16px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .verification-card {
        flex-direction: column;
      }

      .video-player {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Login Page -->
  <div class="login-container" id="loginPage">
    <div class="login-box">
      <h1>Admin Dashboard</h1>
      <p>Sign in to manage verifications and view analytics</p>
      <form onsubmit="login(event)">
        <div class="form-group">
          <label>API URL</label>
          <input type="url" id="apiUrl" placeholder="https://your-railway-url.app/api" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="admin@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="login-btn">Sign In</button>
        <p id="loginError" style="color: var(--red); margin-top: 16px; font-size: 14px; display: none;"></p>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard-container" id="dashboardPage">
    <div class="sidebar">
      <h2>Community App</h2>
      <button class="nav-item active" onclick="showPage('verifications')">📹 Verifications</button>
      <button class="nav-item" onclick="showPage('stats')">📊 Statistics</button>
      <button class="nav-item" onclick="showPage('users')">👥 Users</button>
      <button class="nav-item" onclick="showPage('logs')">📋 Activity Log</button>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>

    <div class="main-content">
      <!-- Verifications Page -->
      <div class="page active" id="verifications">
        <h1 class="page-title">Video Verifications</h1>
        <p style="color: var(--gray-600); margin-bottom: 24px;">Review pending user video verifications</p>
        <div id="verificationsList">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Statistics Page -->
      <div class="page" id="stats">
        <h1 class="page-title">Dashboard Statistics</h1>
        <div id="statsList">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Users Page -->
      <div class="page" id="users">
        <h1 class="page-title">User Management</h1>
        <p style="color: var(--gray-600); margin-bottom: 24px;">Search and manage users</p>
        <div class="card">
          <input type="text" id="userSearch" placeholder="Search by name or email..." style="width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px;">
        </div>
        <div id="usersList">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Logs Page -->
      <div class="page" id="logs">
        <h1 class="page-title">Activity Log</h1>
        <p style="color: var(--gray-600); margin-bottom: 24px;">Audit trail of all admin actions</p>
        <div id="logsList">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let apiUrl = '';
    let token = '';

    async function login(event) {
      event.preventDefault();

      apiUrl = document.getElementById('apiUrl').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');

      try {
        const response = await fetch(`${apiUrl}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          errorEl.textContent = data.error || 'Login failed';
          errorEl.style.display = 'block';
          return;
        }

        token = data.token;
        localStorage.setItem('adminToken', token);
        localStorage.setItem('adminApiUrl', apiUrl);

        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('dashboardPage').style.display = 'flex';

        loadVerifications();
      } catch (err) {
        errorEl.textContent = 'Network error: ' + err.message;
        errorEl.style.display = 'block';
      }
    }

    function logout() {
      token = '';
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminApiUrl');
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('dashboardPage').style.display = 'none';
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');

      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (pageId === 'verifications') loadVerifications();
      if (pageId === 'stats') loadStats();
      if (pageId === 'logs') loadLogs();
    }

    async function loadVerifications() {
      const container = document.getElementById('verificationsList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        const response = await fetch(`${apiUrl}/admin/videos/pending`, {
          headers: { 'Authorization': `Bearer ${token}` },
        });

        const data = await response.json();

        if (data.videos.length === 0) {
          container.innerHTML = '<div class="card"><p style="text-align: center; color: var(--gray-600);">No pending verifications</p></div>';
          return;
        }

        container.innerHTML = data.videos.map(video => `
          <div class="verification-card">
            <div class="video-player">
              <video controls src="${video.video_verification_url}"></video>
            </div>
            <div class="verification-info">
              <h3>${video.first_name}</h3>
              <p><strong>Email:</strong> ${video.email}</p>
              <p><strong>City:</strong> ${video.city}</p>
              <p><strong>Submitted:</strong> ${new Date(video.created_at).toLocaleDateString()}</p>
              <div class="verification-actions">
                <button class="btn btn-primary" onclick="approveVerification('${video.id}')">✓ Approve</button>
                <button class="btn btn-danger" onclick="rejectVerification('${video.id}')">✗ Reject</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div class="card"><p style="color: var(--red);">Error loading verifications: ${err.message}</p></div>`;
      }
    }

    async function approveVerification(userId) {
      try {
        const response = await fetch(`${apiUrl}/admin/videos/approve/${userId}`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ notes: 'Approved via admin dashboard' }),
        });

        if (response.ok) {
          alert('User verified!');
          loadVerifications();
        } else {
          alert('Error approving user');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    async function rejectVerification(userId) {
      const reason = prompt('Why reject this verification?');
      if (!reason) return;

      try {
        const response = await fetch(`${apiUrl}/admin/videos/reject/${userId}`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ reason }),
        });

        if (response.ok) {
          alert('Verification rejected');
          loadVerifications();
        } else {
          alert('Error rejecting verification');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    async function loadStats() {
      const container = document.getElementById('statsList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        const response = await fetch(`${apiUrl}/admin/stats`, {
          headers: { 'Authorization': `Bearer ${token}` },
        });

        const data = await response.json();

        container.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">Total Users</div>
              <div class="stat-value">${data.users.total}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Verified Users</div>
              <div class="stat-value">${data.users.verified}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Verification Rate</div>
              <div class="stat-value">${data.users.verificationRate}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Total Groups</div>
              <div class="stat-value">${data.groups.total}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Total Messages</div>
              <div class="stat-value">${data.messaging.totalMessages}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Hangouts Completed</div>
              <div class="stat-value">${data.hangouts.completed}</div>
            </div>
          </div>

          <div class="card">
            <h3>Groups by City</h3>
            ${data.groups.byCity.map(city => `
              <p style="margin-bottom: 8px;"><strong>${city.city}:</strong> ${city.count} groups</p>
            `).join('')}
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="card"><p style="color: var(--red);">Error loading stats: ${err.message}</p></div>`;
      }
    }

    async function loadLogs() {
      const container = document.getElementById('logsList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        const response = await fetch(`${apiUrl}/admin/logs`, {
          headers: { 'Authorization': `Bearer ${token}` },
        });

        const data = await response.json();

        if (data.logs.length === 0) {
          container.innerHTML = '<div class="card"><p style="text-align: center; color: var(--gray-600);">No activity yet</p></div>';
          return;
        }

        container.innerHTML = data.logs.map(log => `
          <div class="card">
            <p><strong>${log.action}</strong> - ${new Date(log.created_at).toLocaleString()}</p>
            ${log.reason ? `<p style="color: var(--gray-600); margin-top: 8px;">${log.reason}</p>` : ''}
            ${log.notes ? `<p style="color: var(--gray-600); margin-top: 8px;">${log.notes}</p>` : ''}
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div class="card"><p style="color: var(--red);">Error loading logs: ${err.message}</p></div>`;
      }
    }

    // On page load, check if already logged in
    window.addEventListener('load', () => {
      const savedToken = localStorage.getItem('adminToken');
      const savedUrl = localStorage.getItem('adminApiUrl');

      if (savedToken && savedUrl) {
        token = savedToken;
        apiUrl = savedUrl;
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('dashboardPage').style.display = 'flex';
        loadVerifications();
      }
    });
  </script>
</body>
</html>
